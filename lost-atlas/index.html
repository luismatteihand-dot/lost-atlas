<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Marrakech Lost Atlas</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#203B32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lost Atlas">
<script>window.ATLAS_GPS_URL = 'https://luismatteihand-dot.github.io/lost-atlas/';   /* adresse https où le GPS fonctionne (GitHub Pages) */</script>
<link rel="manifest" href="manifest.json">
<script>window.ATLAS_VERSION = '6.0.1';   /* même numéro dans les adresses des fichiers ci-dessous et dans service-worker.js : une mise à jour arrive en bloc, jamais mélangée */</script>
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css?v=6.0.1">
<link rel="stylesheet" href="css/style.css?v=6.0.1">
<link rel="stylesheet" href="css/v3.css?v=6.0.1">
<link rel="stylesheet" href="css/v5.css?v=6.0.1">
</head>
<body>
<div id="app">
  <main id="views">
    <section id="v-atlas" class="view on" aria-label="Atlas">
      <div id="map"></div>
      <div id="chips" class="tchips"></div>
      <div id="offline-note" hidden>OpenStreetMap en ligne indisponible : atlas dessiné affiché</div>
      <div class="fabs">
        <button class="fab" id="fab-gps" data-act="gps" aria-label="Ma position GPS"></button>
        <button class="fab" id="fab-pin" data-act="pin-new" aria-label="Poser un marqueur"></button>
        <button class="fab" id="fab-list" data-act="places" aria-label="Liste des lieux"></button>
        <button class="fab" id="fab-layers" data-act="layers" aria-label="Calques de la carte"></button>
      </div>
      <button id="sessbtn" data-act="sess-new" aria-label="Commencer une aventure"></button>
      <button id="xpill" data-act="x-open" aria-label="Mode exploration"></button>
      <button id="keepfab" data-act="keep" aria-label="Garder quelque chose dans le carnet"><i data-ico="garder"></i><span>Garder</span></button>
      <button id="radar" hidden data-act="open-place"></button>
      <div id="crosshair" aria-hidden="true"></div>
      <div id="pick" hidden><span id="pick-label"></span><div class="btn-row"><button class="btn" data-act="pick-cancel">Annuler</button><button class="btn primary" data-act="pick-ok">Poser ici</button></div></div>
    </section>
    <section id="v-codex" class="view scroll" aria-label="Codex"></section>
    <section id="v-quetes" class="view scroll" aria-label="Aventures"></section>
    <section id="v-carnet" class="view scroll" aria-label="Carnet"></section>
    <section id="v-collection" class="view scroll" aria-label="Sac"></section>
    <section id="v-profil" class="view scroll" aria-label="Héros"></section>
  </main>
  <nav id="tabbar" aria-label="Rubriques">
    <button data-act="tab" data-v="atlas" class="on"><i data-ico="atlas"></i><span>Monde</span></button>
    <button data-act="tab" data-v="quetes"><i data-ico="aventure"></i><span>Aventures</span></button>
    <button data-act="tab" data-v="carnet"><i data-ico="carnet"></i><span>Carnet</span></button>
    <button data-act="tab" data-v="collection"><i data-ico="sac"></i><span>Sac</span></button>
    <button data-act="tab" data-v="profil"><i data-ico="profil"></i><span>Héros</span></button>
  </nav>
  <div id="scrim" data-act="sheet-close"></div>
  <aside id="sheet" hidden>
    <div class="sh-bar"><button id="sh-back" data-act="sheet-back">‹ Retour</button><span class="grip"></span><button id="sh-close" data-act="sheet-close" aria-label="Fermer">Fermer</button></div>
    <div id="sheet-body"></div>
  </aside>
  <div id="pocket" hidden><div class="pk-star"></div><p class="pk-t">Mode poche</p><p id="pocket-st"></p><button id="pocket-hold">Maintiens pour déverrouiller</button><p class="pk-n">L'écran reste allumé et noir. Les signaux continuent.</p></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="reveal" aria-live="polite"><i class="rv-line"></i><div id="rv-sub"></div><div id="rv-title"></div><i class="rv-line"></i></div>
  <div id="boot"><div>Marrakech<b>The Lost Atlas</b><small id="boot-msg">Ouverture de l'atlas…</small></div></div>
</div>
<script src="vendor/leaflet.js?v=6.0.1"></script>
<script src="data/bundle.js?v=6.0.1"></script>
<script src="data/basemap.js?v=6.0.1"></script>
<script src="data/v3.js?v=6.0.1"></script>
<script src="data/quotidien.js?v=6.0.1"></script>
<script src="js/art.js?v=6.0.1"></script>
<script src="js/storage.js?v=6.0.1"></script>
<script src="js/data.js?v=6.0.1"></script>
<script src="js/game.js?v=6.0.1"></script>
<script src="js/basemap.js?v=6.0.1"></script>
<script src="js/map.js?v=6.0.1"></script>
<script src="js/ui.js?v=6.0.1"></script>
<script src="js/views.js?v=6.0.1"></script>
<script src="js/sound.js?v=6.0.1"></script>
<script src="js/photostore.js?v=6.0.1"></script>
<script src="js/v3.js?v=6.0.1"></script>
<script src="js/explore.js?v=6.0.1"></script>
<script src="js/photo.js?v=6.0.1"></script>
<script src="js/diag.js?v=6.0.1"></script>
<script src="js/trace.js?v=6.0.1"></script>
<script src="js/quotidien.js?v=6.0.1"></script>
<script src="js/immersion.js?v=6.0.1"></script>
<script src="js/session.js?v=6.0.1"></script>
<script src="js/app.js?v=6.0.1"></script>
</body>
</html>
